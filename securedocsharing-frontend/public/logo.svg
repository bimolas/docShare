<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circles behind the square with the theme's accent color -->
  <circle cx="56" cy="30" r="20" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="70" cy="50" r="20" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="56" cy="70" r="20" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Rounded square with white fill to overlap the background circles, with accent stroke -->
  <rect x="10" y="28" width="44" height="44" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- "S" text centered inside the rounded square with accent color -->
  <text x="32" y="52" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f97316" text-anchor="middle" dominant-baseline="central">S</text>
</svg>
