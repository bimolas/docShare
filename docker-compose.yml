services:
  # 1. KEYCLOAK DATABASE
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_admin
      POSTGRES_PASSWORD: StrongDbPassword123!
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - docshare-network

  # 2. KEYCLOAK IAM SERVER (BUMPED TO 26.6.4)
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: keycloak-server
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak_admin
      KC_DB_PASSWORD: StrongDbPassword123!
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: SuperSecureAdminPassword123!
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - keycloak-db
    networks:
      - docshare-network

  # 2.5 MAILPIT MOCK SMTP SERVER
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Port
    networks:
      - docshare-network

  # 3. MINIO (OPEN-SOURCE S3 FILE STORAGE)
  minio:
    image: minio/minio:latest
    container_name: minio-s3-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: MinioSecretPassword123!
    ports:
      - "9000:9000" # MinIO API Port
      - "9001:9001" # MinIO Web Console Port
    volumes:
      - minio_s3_data:/data
    networks:
      - docshare-network

  # 4. APPLICATION DATABASE (DOCSHARE POSTGRES)
  app-db:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_DB: docshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - app_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - docshare-network

  # 5. REDIS CACHE
  redis:
    image: redis:7-alpine
    container_name: docshare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docshare-network

  # 6. PGADMIN 4 (POSTGRES WEB GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-web
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - docshare-network

  # 7. ZOOKEEPER FOR KAFKA
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: docshare-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log
    networks:
      - docshare-network

  # 8. KAFKA EVENT BROKER
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: docshare-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - docshare-network

  # 9. GANACHE IMMUTABLE BLOCKCHAIN SIMULATOR (PERSISTENT DATA)
  ganache:
    image: trufflesuite/ganache:v7.9.1
    container_name: docshare-ganache
    command: --host 0.0.0.0 --port 8545 --db /ganache_data --mnemonic "docshare permission blockchain anchor key phrase test"
    ports:
      - "8545:8545"
    volumes:
      - ganache_data:/ganache_data
    networks:
      - docshare-network

volumes:
  keycloak_db_data:
  minio_s3_data:
  app_db_data:
  redis_data:
  pgadmin_data:
  zk_data:
  zk_log:
  kafka_data:
  ganache_data:

networks:
  docshare-network:
    driver: bridge

